    <circle cx="115.4" cy="106" r="4.6"/><circle cx="140.6" cy="106" r="4.6"/>
    <circle cx="128" cy="62" r="14"/>
  </g>
  <circle cx="128" cy="62" r="29" fill="none" stroke="#000" stroke-width="6"/>
</svg>
