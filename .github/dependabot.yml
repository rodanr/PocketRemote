version: 2
updates:
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /desktop/fuzz
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    # Expo SDK pins react, react-native and the expo-* packages, and its tooling lags new majors of
    # typescript and eslint. Majors for these come with an Expo SDK upgrade, not from Dependabot.
    # Minor and patch updates still arrive.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
