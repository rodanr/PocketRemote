name: Release

# Pushing a tag like v1.0.0 builds the Mac app (.dmg) and the Android APK on clean machines and
# creates a DRAFT GitHub release with both files and SHA256SUMS. You review the draft and press Publish.
# "Run workflow" (workflow_dispatch) builds the same files without publishing, as a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mac:
    name: macOS app (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build app and dmg
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/PocketRemote-*.dmg
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build release APK
        run: scripts/build-android.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/PocketRemote-*.apk
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [mac, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release (this job only)
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum PocketRemote-* > SHA256SUMS && cat SHA256SUMS
      # Build provenance needs a public repository (or GitHub Enterprise), so it runs once the repo is public.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false
        with:
          subject-path: dist/PocketRemote-*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/PocketRemote-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --title "PocketRemote ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "The Mac app is ad-hoc signed and not notarized: approve it once under System Settings, Privacy & Security, Open Anyway. Homebrew users skip that step: brew install --cask rodanr/tap/pocketremote. See docs/INSTALL.md."
