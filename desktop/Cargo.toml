[package]
name = "pocketremote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
httparse = "1.10.1"
if-addrs = "0.15.0"
keyring-core = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "std"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30.0"
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-std"] }
ts-rs = "12.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
