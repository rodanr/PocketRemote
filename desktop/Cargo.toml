[package]
name = "pocketremote"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
default-run = "pocketremote"

[features]
# The menu-bar / tray host app and its Control Panel. Off by default so the core crate and its CI
# stay free of GUI and system-library dependencies (Linux tray needs GTK).
gui = ["dep:iced", "dep:tray-icon", "dep:muda"]

[[bin]]
name = "pocketremote-host"
path = "src/bin/host/main.rs"
required-features = ["gui"]

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
# GUI (feature "gui"): iced renders the Control Panel (software renderer, so idle RAM stays low; its qr_code
# widget draws the pairing QR); tray-icon + muda give the menu-bar icon and its menu. All three are
# the stack PLAN.md section 5.1 names; the spike (docs/spike-report.md) ran them on macOS.
iced = { version = "0.14.0", optional = true, default-features = false, features = ["tokio", "tiny-skia", "qr_code"] }
muda = { version = "0.21.2", optional = true }
tray-icon = { version = "0.26.1", optional = true }
httparse = "1.10.1"
if-addrs = "0.15.0"
keyring-core = "1.0.1"
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "std"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }
tokio-tungstenite = "0.30.0"
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-std"] }
ts-rs = "12.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
enigo = "0.6.1"
