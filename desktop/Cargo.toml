[package]
name = "pocketremote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "std"] }
subtle = "2.6.1"
zeroize = "1.9.2"

[dev-dependencies]
ts-rs = "12.0.1"
