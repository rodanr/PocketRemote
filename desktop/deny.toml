# cargo-deny policy (PLAN.md §9). Advisories, licenses, bans and sources must all pass.
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Our own crate is unpublished; it is Apache-2.0 (see LICENSE).
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Pulled in by the optional GUI (feature gui): permissive licenses.
    "BSL-1.0",                       # clipboard-win, error-code (Windows clipboard)
    "Apache-2.0 WITH LLVM-exception", # target-lexicon
]
# MPL-2.0 is file-level copyleft. Allowed for exactly one unmodified crate, nothing else.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
