[package]
name = "pocketremote-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom", "std"] }

[dependencies.pocketremote]
path = ".."

# Own workspace so fuzzing never affects the main build.
[workspace]

[[bin]]
name = "app_message"
path = "fuzz_targets/app_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_frames"
path = "fuzz_targets/handshake_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transport_frames"
path = "fuzz_targets/transport_frames.rs"
test = false
doc = false
bench = false
