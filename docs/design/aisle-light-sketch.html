<!doctype html><html><head><meta charset="utf-8"><title>Aisle Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:390px;height:844px;overflow:hidden}
body{position:relative;font-family:Roboto,system-ui,sans-serif}
body{background:#07070a;color:#e8e2d6;padding:16px}
.h{display:flex;align-items:center;gap:10px;height:44px}.h i{width:12px;height:12px;border-radius:50%;background:#ffb454;box-shadow:0 0 14px #ffb45488}
.h b{font-weight:500;font-size:18px}.h span{margin-left:auto;color:#a08a6a;font-size:14px}
.kb{display:flex;gap:8px;margin:6px 0 14px}.kb i{flex:1;height:48px;border-radius:24px;background:#14120f;padding:14px 18px;color:#6f6556;font-style:normal;font-size:15px}
.kb u{width:72px;border-radius:24px;background:#ffb454;color:#1a1208;text-decoration:none;text-align:center;padding-top:14px;font-weight:500}
.m{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.m span{height:58px;border-radius:16px;background:#14120f;border:1px solid #2a2218;display:flex;align-items:center;justify-content:center;font-size:14px;color:#cfc6b4}
.m .a{background:#ffb454;color:#1a1208;border-color:#ffb454;font-weight:500}
.row{display:flex;gap:14px;margin-bottom:14px}.dp{width:150px;height:130px;border-radius:65px;background:#14120f;border:1px solid #2a2218;display:flex;align-items:center;justify-content:center;color:#ffb454;font-size:20px;letter-spacing:6px}
.br{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.br span{height:38px;border-radius:12px;background:#14120f;padding:10px;font-size:13px;color:#a08a6a}
.tp{position:absolute;left:16px;right:16px;top:520px;bottom:16px;border-radius:28px;background:#0e0d0b;border:1px solid #2a2218}
.tp:before,.tp:after{content:"";position:absolute;top:18px;bottom:18px;width:6px;background:radial-gradient(circle,#ffb454 2px,transparent 2.5px) 0 0/6px 22px repeat-y;opacity:.85}
.tp:before{left:12px}.tp:after{right:12px}</style></head><body><div class="h"><i></i><b>MacBook Pro</b><span>YouTube ▾ &nbsp; ⚙</span></div>
<div class="kb"><i>Type to send…</i><u>Send</u></div>
<div class="m"><span class="a">Play</span><span>−10s</span><span>+10s</span><span>Full</span><span>CC</span><span>Mute</span><span>Vol −</span><span>Vol +</span></div>
<div class="row"><div class="dp">◀ OK ▶</div><div class="br"><span>Back</span><span>Fwd</span><span>Reload</span><span>◀ Tab</span><span>Tab ▶</span><span>Close</span></div></div>
<div class="tp"></div></body></html>
